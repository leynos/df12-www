# Layout metadata for documentation rendering. Supports multiple page bundles
# via the `pages` mapping. Each page entry may override defaults and define its
# own section layout preferences.

defaults:
  output_dir: public
  filename_prefix: docs-
  pygments_style: monokai
  page_title_suffix: "df12 Reference Library"
  source_label: "Source material"
  footer_note: "Serious tools, playful worlds."
  default_page: netsuke
  branch: main
  doc_path: docs/users-guide.md
  docs_index_output: public/docs.html
  theme:
    hero_eyebrow: df12 Documentation
    hero_tagline: Tools for ambitious engineering teams
    doc_label: Docs
    site_name: df12 Productions

homepage:
  output: public/index.html
  title: "df12 — Serious tools, playful worlds."
  navigation:
    links:
      - label: Tools
        href: "#systems"
        nav_target: systems
      - label: Creative
        href: "#worlds"
        nav_target: worlds
        variant: accent
      - label: Docs
        href: "docs.html"
        variant: neutral
      - label: About
        href: "about.html"
        variant: neutral
  hero:
    brand_text: df12
    eyebrow: Productions
    title_primary: "Serious tools,"
    title_secondary: playful
    accent_text: "worlds."
    description: >-
      We build tools that make ambitious engineering calmer and craft stories that map the strange,
      human edges of complex networks.
    ctas:
      - label: Explore Tools
        href: "#systems"
        variant: primary
      - label: Browse Worlds
        href: "#worlds"
        variant: secondary
  systems:
    heading: Systems We Build
    kicker: Fast, elegant, and open by design.
    cards:
      - label: Limela
        description: Cluster email fast. Turn inboxes into a navigable knowledge spine.
        href: "https://github.com/leynos/limela"
        icon: limela
        meta_label: View on GitHub
        external: true
      - label: Netsuke
        description: YAML-first builds (Ninja × Jinja). Fast, reproducible, readable.
        href: "netsuke/"
        icon: netsuke
        meta_label: Learn more
        external: false
      - label: mxd
        description: Hotline-style daemon for joyful file-sharing and retro chat.
        href: "mxd/"
        icon: mxd
        meta_label: Learn more
        external: false
      - label: Episodic
        description: Agentic podcast studio with human-in-the-loop polish.
        href: "https://github.com/leynos/episodic"
        icon: episodic
        meta_label: View on GitHub
        external: true
      - label: Weaver
        description: CLI tooling for code-aware AI agents. Observe, act, verify.
        href: "weaver/"
        icon: weaver
        meta_label: Learn more
        external: false
      - label: Gauss
        description: Accessible SVG illustration with scriptable precision. Illustrator for the open web.
        href: "https://github.com/leynos/gauss"
        icon: gauss
        meta_label: View on GitHub
        external: true
      - label: Corbusier
        description: AI agent orchestration. The best room, not the smartest agent.
        href: "https://github.com/leynos/corbusier"
        icon: corbusier
        meta_label: View on GitHub
        external: true
      - label: Stilyagi
        description: Deterministic prose linting for docs and doc comments. A compiler for prose.
        href: "stilyagi/"
        icon: stilyagi
        meta_label: Learn more
        external: false
  worlds:
    heading: Worlds We Dream
    kicker: Narratives that map the strange and human in the system.
    cards:
      - label: Wildside
        description: Serendipity for urban wanderers. Late-night drift; unexpected connections.
        href: "https://github.com/leynos/wildside"
        external: true
        classes:
          - group
          - cq
          - world-card
          - pressable
        image:
          avif: images/wildside-alley.avif
          webp: images/wildside-alley.webp
          fallback: images/wildside-alley.png
          alt: >-
            A moody, atmospheric image of a neon-lit city street at night, noir style, magenta and cyan highlights
            reflecting on wet pavement, cinematic photography.
          width: 1536
          height: 1024
          sizes: "(min-width: 768px) 50vw, 100vw"
        cta_label: Read the pitch
      - label: Pentagon
        description: "Retro-cyberpunk Moscow, 2002: hackers, hardware, and the cost of genius."
        href: "mailto:hello@df12.studio?subject=Pentagon%20Pitch%20Request"
        external: false
        classes:
          - group
          - cq
          - world-card
          - world-card--media-after
          - world-card--crop-low
          - pressable
          - border-accent/20
          - bg-neutral/40
        image:
          avif: images/pentagon-cafe-bytes.avif
          webp: images/pentagon-cafe-bytes.webp
          fallback: images/pentagon-cafe-bytes.png
          alt: A dimly lit workspace filled with vintage computer hardware glowing with neon accents.
          width: 1536
          height: 1024
          sizes: "(min-width: 768px) 50vw, 100vw"
        cta_label: Request the pitch deck
      - label: Messy Secrets
        description: 1980s Hollywood noir where reputation is the most volatile asset.
        href: "mailto:hello@df12.studio?subject=Messy%20Secrets%20Pitch%20Request"
        external: false
        classes:
          - group
          - cq
          - world-card
          - world-card--media-after
          - pressable
          - border-accent/20
          - bg-neutral/40
        image:
          avif: images/messy-secrets-pager2.avif
          webp: images/messy-secrets-pager2.webp
          fallback: images/messy-secrets-pager2.png
          alt: A noir-inspired street scene with vintage neon signs glowing through mist.
          width: 1089
          height: 957
          sizes: "(min-width: 768px) 50vw, 100vw"
        cta_label: Request the pitch deck
  footer: &site_footer
    site_name: df12 Productions
    blurb: Serious systems, playful worlds. We ship tools that cut build times and stories that map the human edge of 
      complex networks.
    oss_heading: "OSS & Licences"
    contact_heading: Stay in touch
    closing_lede: Built for curious builders and storytellers everywhere.
    copyright_year: 2025
    oss_links:
      - label: "Limela — licence"
        href: "https://github.com/leynos/limela/blob/main/LICENSE"
      - label: "Netsuke — licence"
        href: "https://github.com/leynos/netsuke/blob/main/LICENSE"
      - label: "mxd — licence"
        href: "https://github.com/leynos/mxd/blob/main/LICENSE"
      - label: "Episodic — licence"
        href: "https://github.com/leynos/episodic/blob/main/LICENSE"
    contact_links:
      - label: hello@df12.studio
        href: "mailto:hello@df12.studio"
        variant: accent
        external: false
      - label: GitHub
        href: "https://github.com/leynos"
        variant: accent
        icon: carbon:logo-github
        external: true
      - label: Bluesky
        href: "https://bsky.app/profile/df12.studio"
        variant: accent
        icon: carbon:logo-bluesky
        external: true

about:
  output: public/about.html
  title: "About — df12"
  navigation:
    brand_href: "index.html"
    brand_text: df12
    links:
      - label: Tools
        href: "index.html#systems"
        nav_target: systems
      - label: Creative
        href: "index.html#worlds"
        nav_target: worlds
        variant: accent
      - label: Docs
        href: "docs.html"
        variant: neutral
      - label: About
        href: "about.html"
        current: true
        variant: neutral
  hero:
    name: Payton McIntosh
    email: hello@df12.studio
    intro: >-
      The software gremlin behind df12, building small sharp tools, humane infra and retro-tinted experiments in code,
      maps, audio and story.
    avatar:
      src: images/payton-mcintosh.png
      alt: Portrait of Payton McIntosh
      width: 480
      height: 480
  about:
    blurb: >-
      Payton has spent years leading teams in large organisations — long enough to know where the sharp edges hide.
      df12 is their way of turning that scar tissue into a coherent boutique studio instead of a junkyard of side
      projects.
    location:
      title: Based in Edinburgh, Scotland
      description: Mediaeval skyline, liminal closes, and a surprisingly feral little tech scene.
      icon: carbon:location
  focus:
    cards:
      - title: Humane Infrastructure
        description: Building for the people who maintain systems, not just those who use them. Good infra stays out of 
          your way until you need it.
        icon: carbon:person-favorite
        tone: primary
      - title: Legible Systems
        description: If you can't reason about a system, you can't trust it. Observability isn't an add-on — it's the 
          foundation everything else rests on.
        icon: carbon:cloud-monitoring
        tone: accent
      - title: Calmer AI Tooling
        description: AI workflows fail in novel ways. The answer isn't more guardrails — it's designing for graceful 
          degradation and predictable recovery.
        icon: carbon:ai-governance-lifecycle
        tone: neutral
  principles:
    items:
      - title: Small, Sharp Tools
        description: Each tool does one thing exceptionally well. No bloat, no feature creep, just focused utility.
      - title: 5-Minute Success Path
        description: From installation to first successful run in under five minutes. Every tool includes quickstart 
          documentation.
      - title: Repeatability Over Magic
        description: Predictable behaviour across environments. Green-path repeatability means fewer surprises in 
          production.
      - title: Respect Cognitive Load
        description: Systems should be legible and unsurprising. Complexity exists in the implementation, not the 
          interface.
  footer: *site_footer

pages:
  # -- Tools ---------------------------------------------------------------
  catnap:
    label: "Catnap"
    repo: leynos/catnap
    latest_release: v0.1.0
    latest_release_published_at: '2026-06-28T22:52:52Z'
    language: rust
    category: tool
    filename_prefix: docs-catnap-
    page_title_suffix: "Catnap"
    description: >
      GNU-style `sleep` that reports time remaining on stderr while stdout
      stays clean. Scripts read silence; humans read progress.

  claude-q:
    label: "claude-q"
    repo: leynos/claude-q
    language: python
    category: tool
    filename_prefix: docs-claude-q-
    page_title_suffix: "claude-q"
    description: >
      Topic-based FIFO task queue for Claude Code. Queue work with `q put`,
      dequeue when context allows – nothing gets forgotten between sessions.

  concordat:
    label: "Concordat"
    repo: leynos/concordat
    language: python
    category: tool
    filename_prefix: docs-concordat-
    page_title_suffix: "Concordat"
    description: >
      Enforces consistent GitHub repository settings across an estate of
      enrolled repos by driving OpenTofu. Plan, review, apply – settings
      drift ends here.

  create-labels:
    label: "create-labels"
    repo: leynos/create-labels
    language: python
    category: tool
    filename_prefix: docs-create-labels-
    page_title_suffix: "create-labels"
    description: >
      Creates and updates GitHub labels from a TOML file or a sensible
      default set. Idempotent, Enterprise-aware, and deletes nothing.

  css-view:
    label: "css-view"
    repo: leynos/css-view
    language: typescript
    category: tool
    filename_prefix: docs-css-view-
    page_title_suffix: "css-view"
    description: >
      Gives agents a view of computed styles. Captures deduplicated CSS
      snapshots from a live page via agent-browser, the Chromium DevTools
      Protocol, or Playwright – DevTools for terminals.

  dakar:
    label: "Dakar"
    repo: leynos/Dakar
    language: javascript
    category: tool
    filename_prefix: docs-dakar-
    page_title_suffix: "Dakar"
    description: >
      Code review with a hard per-review cost ceiling. Bounded model lanes,
      admission control, and a `dakar-review` CLI.

  ddlint:
    label: "ddlint"
    repo: leynos/ddlint
    language: rust
    category: tool
    filename_prefix: docs-ddlint-
    page_title_suffix: "ddlint"
    description: >
      Linter for Differential Datalog. A Logos tokenizer, an error-recovering
      Chumsky parser, and a Rowan syntax tree – lints that survive broken
      input.

  dear-diary:
    label: "Dear Diary"
    repo: leynos/dear-diary
    language: rust
    category: tool
    filename_prefix: docs-dear-diary-
    page_title_suffix: "Dear Diary"
    description: >
      MCP server giving coding agents persistent semantic memory. Qdrant
      vectors and local FastEmbed embeddings – no cloud round-trips.

  df12-build:
    label: "df12-build"
    repo: leynos/df12-build
    language: typescript
    category: tool
    filename_prefix: docs-df12-build-
    page_title_suffix: "df12-build"
    description: >
      ODW workflows plus a supervisor skill that drive a project from
      roadmap through planning, review, implementation, and merge. Happy
      robots build happy code.

  df12-lints:
    label: "df12-lints"
    repo: leynos/df12-lints
    language: javascript
    category: tool
    filename_prefix: docs-df12-lints-
    page_title_suffix: "df12-lints"
    description: >
      Shared lint tooling for JavaScript and TypeScript: an Oxlint plugin
      with local rules for conditional complexity and documentation.

  digitalpuddle:
    label: "Digital Puddle"
    repo: leynos/digitalpuddle
    language: typescript
    category: tool
    filename_prefix: docs-digitalpuddle-
    page_title_suffix: "Digital Puddle"
    description: >
      Local DigitalOcean v2 API simulator. A deterministic, seeded control
      plane with action polling and eventual consistency for infrastructure
      tests.

  frankie:
    label: "Frankie"
    repo: leynos/frankie
    language: rust
    category: tool
    filename_prefix: docs-frankie-
    page_title_suffix: "Frankie"
    description: >
      Terminal code review assistant. Pulls pull-request comments into a
      keyboard-driven TUI with SQLite caching and background refresh.

  git-donkey:
    label: "git-donkey"
    repo: leynos/git-donkey
    language: python
    category: tool
    filename_prefix: docs-git-donkey-
    page_title_suffix: "git-donkey"
    description: >
      Git subcommands that make branch-based development less of a… well,
      you know. Linked worktrees, branch tracking, and repository
      scaffolding.

  hecate:
    label: "Hecate"
    repo: leynos/hecate
    language: python
    category: tool
    filename_prefix: docs-hecate-
    page_title_suffix: "Hecate"
    description: >
      Architecture checker for hexagonal Python projects. Walks package
      roots with `ast`, classifies imports, and reports boundary violations.

  lading:
    label: "Lading"
    repo: leynos/lading
    latest_release: v0.2.0
    latest_release_published_at: '2026-06-21T14:18:45Z'
    language: python
    category: tool
    filename_prefix: docs-lading-
    page_title_suffix: "Lading"
    description: >
      Coordinates version bumps and publication plans across a Rust
      workspace from one `lading.toml`. Dry runs before releases.

  mapsplice:
    label: "Mapsplice"
    repo: leynos/mapsplice
    language: rust
    category: tool
    filename_prefix: docs-mapsplice-
    page_title_suffix: "Mapsplice"
    description: >
      Splices one Markdown roadmap into another. Structural edits,
      renumbered phases, and rewritten cross-references – no manual
      renumbering.

  mdtablefix:
    label: "mdtablefix"
    repo: leynos/mdtablefix
    latest_release: v0.5.0
    latest_release_published_at: '2026-07-27T18:21:15Z'
    language: rust
    category: tool
    filename_prefix: docs-mdtablefix-
    page_title_suffix: "mdtablefix"
    description: >
      Unb0rks Markdown tables. Reflows columns to uniform widths and wraps
      prose to 80 columns with Markdown-aware tokenization.

  mriya:
    label: "Mriya"
    repo: leynos/mriya
    language: rust
    category: tool
    filename_prefix: docs-mriya-
    page_title_suffix: "Mriya"
    description: >
      Syncs the working directory to a short-lived cloud VM, runs the build
      there over SSH, streams output back, and destroys the evidence.

  netsuke:
    label: "Netsuke"
    repo: leynos/netsuke
    language: rust
    category: tool
    source_label: "Netsuke User Guide (main)"
    page_title_suffix: "Netsuke"
    filename_prefix: docs-netsuke-
    footer_note: "Built with Netsuke."
    description: >
      YAML-powered build system that fuses the minimalism of Ninja with the
      templating nous of Jinja. Write once, build anywhere—reproducible,
      declarative, and just opinionated enough to keep you honest.
    theme:
      hero_eyebrow: Netsuke Documentation
      hero_tagline: Declarative build tooling for ambitious teams
    layouts:
      getting-started:
        device: numbered_steps
        step_order:
          - Installation
          - Basic Usage
      the-netsukefile-manifest:
        device: split_panel
        emphasized_code_block: 0
      defining-rules:
        device: split_panel
      defining-targets-and-actions:
        device: split_panel
      jinja-templating-in-netsuke:
        device: split_panel
        emphasized_code_block: 1
      netsuke-standard-library-stdlib:
        device: split_panel
      command-line-interface-cli:
        device: numbered_steps
        step_order:
          - Global Options
          - Commands
          - Exit Codes

  nixie:
    label: "Nixie"
    repo: leynos/nixie
    latest_release: v1.1.0
    latest_release_published_at: '2026-06-28T22:50:23Z'
    language: python
    category: tool
    filename_prefix: docs-nixie-
    page_title_suffix: "Nixie"
    description: >
      Finds Mermaid blocks in Markdown and renders every one to prove it
      compiles. Broken diagrams fail the build, not the reader.

  odw-lint:
    label: "odw-lint"
    repo: leynos/odw-lint
    language: typescript
    category: tool
    filename_prefix: docs-odw-lint-
    page_title_suffix: "odw-lint"
    description: >
      Static linter for Open Dynamic Workflow files. Checks workflows before
      they run – without executing source or dispatching agents.

  podbot:
    label: "Podbot"
    repo: leynos/podbot
    language: rust
    category: tool
    filename_prefix: docs-podbot-
    page_title_suffix: "Podbot"
    description: >
      Runs AI coding agents inside isolated Podman containers. Credentials
      and the container socket stay with the trusted host side.

  polythene:
    label: "Polythene"
    repo: leynos/polythene
    language: python
    category: tool
    filename_prefix: docs-polythene-
    page_title_suffix: "Polythene"
    description: >
      Temu-tier isolation for unit testing. Pulls container images, exports
      them to disposable root filesystems, and executes commands via podman,
      bwrap, proot, or chroot.

  post-turn-quality-stop-hook:
    label: "post-turn-quality-stop-hook"
    repo: leynos/post-turn-quality-stop-hook
    language: python
    category: tool
    filename_prefix: docs-post-turn-quality-
    page_title_suffix: "post-turn-quality-stop-hook"
    description: >
      Claude Code stop hook that works out which files a turn changed, runs
      the matching quality targets, and blocks the turn until they pass.

  repo-local-tools:
    label: "repo-local-tools"
    repo: leynos/repo-local-tools
    language: python
    category: tool
    filename_prefix: docs-repo-local-tools-
    page_title_suffix: "repo-local-tools"
    description: >
      Renders shared MCP configuration and reusable agent skills from one
      XDG data directory into repository-local files for Claude, Codex, and
      friends.

  rust-prover-tools:
    label: "rust-prover-tools"
    repo: leynos/rust-prover-tools
    language: python
    category: tool
    filename_prefix: docs-rust-prover-tools-
    page_title_suffix: "rust-prover-tools"
    description: >
      Installs, version-checks, and runs the Kani and Verus verification
      toolchains for Rust repositories. One CLI instead of four READMEs.

  stilyagi:
    label: "Stilyagi"
    repo: leynos/stilyagi
    language: rust
    category: tool
    filename_prefix: docs-stilyagi-
    page_title_suffix: "Stilyagi"
    description: >
      Prose linter for Markdown and source-code doc comments. Tree-sitter
      extraction, a Rust core, and Python bindings – style enforcement that
      reads the code too.

  typos-config-builder:
    label: "typos-config-builder"
    repo: leynos/typos-config-builder
    language: python
    category: tool
    filename_prefix: docs-typos-config-builder-
    page_title_suffix: "typos-config-builder"
    description: >
      Generates en-GB-oxendict `typos.toml` configuration. Refreshes a
      shared Oxford dictionary cache and merges repository-local overrides.

  vk:
    label: "vk"
    repo: leynos/vk
    latest_release: v0.5.0
    latest_release_published_at: '2025-09-18T21:43:05Z'
    language: rust
    category: tool
    filename_prefix: docs-vk-
    page_title_suffix: "vk"
    description: >
      Fetches unresolved pull-request review comments and renders them as
      terminal Markdown. Issues and CI status included.

  weaver:
    label: "Weaver"
    repo: leynos/weaver
    language: rust
    category: tool
    filename_prefix: docs-weaver-
    page_title_suffix: "Weaver"
    description: >
      Semantic CLI for codebases. A light client, a `weaverd` daemon,
      sandboxed language servers, and tree-sitter – observe, act, verify.

  whitaker:
    label: "Whitaker"
    repo: leynos/whitaker
    latest_release: v0.2.7
    latest_release_published_at: '2026-07-22T22:35:51Z'
    language: rust
    category: tool
    filename_prefix: docs-whitaker-
    page_title_suffix: "Whitaker"
    description: >
      Nine opinionated Dylint lints for Rust, plus one experimental opt-in.
      Snark included at no extra charge.

  # -- Libraries -----------------------------------------------------------
  actix-v2a:
    label: "actix-v2a"
    repo: leynos/actix-v2a
    language: rust
    category: library
    filename_prefix: docs-actix-v2a-
    page_title_suffix: "actix-v2a"
    description: >
      Shared Actix Web building blocks: keyset cursor pagination,
      idempotency handling, server-sent events, and OpenAPI helpers.

  chutoro:
    label: "Chutoro"
    repo: leynos/chutoro
    language: rust
    category: library
    filename_prefix: docs-chutoro-
    page_title_suffix: "Chutoro"
    description: >
      Work-in-progress FISHDBC engine written in Rust that merges a
      rayon-driven CPU path, Rust-CUDA kernels, and a C-ABI plugin system.
      Built for safe, iterative clustering across heterogeneous
      hardware—sushi-grade data science.

  cmd-mox:
    label: "CmdMox"
    repo: leynos/cmd-mox
    latest_release: v0.2.0
    latest_release_published_at: '2025-11-27T02:51:36Z'
    doc_path: docs/usage-guide.md
    language: python
    category: library
    filename_prefix: docs-cmd-mox-
    page_title_suffix: "CmdMox"
    description: >
      Python-native command mocking harness that intercepts external processes
      over Unix domain sockets so pytest suites can spy, stub, and replay shell
      workflows without brittle bash fixtures.

  cuprum:
    label: "Cuprum"
    repo: leynos/cuprum
    latest_release: v0.1.0
    latest_release_published_at: '2026-01-30T18:58:38Z'
    language: python
    category: library
    filename_prefix: docs-cuprum-
    page_title_suffix: "Cuprum"
    description: >
      Typed, async-first process execution from a curated catalogue of
      approved executables. Structured results, synchronous wrappers
      included.

  diesel-cte-ext:
    label: "diesel-cte-ext"
    repo: leynos/diesel-cte-ext
    latest_release: v0.3.0
    latest_release_published_at: '2026-07-22T22:47:37Z'
    language: rust
    category: library
    filename_prefix: docs-diesel-cte-ext-
    page_title_suffix: "diesel-cte-ext"
    description: >
      Common Table Expressions for Diesel. Builders for recursive and
      non-recursive CTEs, with column metadata helpers.

  falcon-correlate:
    label: "Falcon Correlate"
    repo: leynos/falcon-correlate
    language: python
    category: library
    filename_prefix: docs-falcon-correlate-
    page_title_suffix: "Falcon Correlate"
    description: >
      Correlation IDs for Falcon web applications. One middleware,
      traceable requests.

  falcon-pachinko:
    label: "Falcon Pachinko"
    repo: leynos/falcon-pachinko
    language: python
    category: library
    filename_prefix: docs-falcon-pachinko-
    page_title_suffix: "Falcon Pachinko"
    description: >
      Falcon extension for structured WebSocket routing and event
      orchestration. Define msgspec payload schemas, spin up background
      workers, and broadcast updates to rooms—all without turning your ASGI
      app into spaghetti.

  femtologging:
    label: "femtologging"
    repo: leynos/femtologging
    language: python
