# Repository-specific identifiers, quotations and deliberate fixtures.

schema = 1

[oxford]
stems = []

[words]
accepted = [
  "Flavored",
  "Hashi",
]

[words.corrections]

[patterns]
# Inline code is checked by default so misspelled identifiers stay visible.
# The exemptions below cover CSS tokens and keywords, the placeholders the
# migration guides use to describe them, upstream identifiers that carry US
# spelling, and one deliberate fixture typo. Prose and every other identifier
# remain subject to the en-GB rules.
ignore = [
  # CSS keywords and functions.
  'currentColor',
  'color-mix\(\)',
  # Tailwind and daisyUI colour tokens, and the placeholder used to describe
  # them in the migration guides.
  '--(?:tw-)?color-[a-z0-9*-]+',
  '--my-brand-color',
  '\{color\}',
  '`color`',
  # The CSS `color` property quoted as a declaration, and the name of the
  # accessibility tool that measures it. Both are citations.
  'color:\s*var\(',
  'check_color_contrast',
  # CSS longhand property names ending in -color. The specification spells
  # them the American way, so quoting one in prose is a citation, not a
  # lapse. The leading segment is required, so bare "color" stays caught.
  '[a-z][a-z0-9*]*(?:-[a-z0-9*]+)*-color\b',
  # Weaver CLI flag name (upstream contract, ADR 007).
  '--color',
  # daisyUI placement modifiers.
  '(?:carousel|dropdown|footer|indicator|navbar|toast)-center',
  # Netsuke design token, spelled with the double-l variant in the stylesheet.
  '--netsuke-vermillion',
  # Pygments/OpenTofu API names that predate the en-GB policy.
  'background_color',
  # Deliberate fixture: an error-message example demonstrating a mistyped
  # variable reference.
  'var\.iamge_id',
]

[files]
exclude = []
