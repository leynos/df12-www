# Font Awesome to Carbon icon mapping for the Weaver sub-site.
#
# Weaver used Font Awesome 6.4 from a CDN, loaded twice — once as a stylesheet
# and once as the SVG-replacement script. This table replaces it: the icons
# named here are extracted from the @iconify-json/carbon package at build time
# by scripts/generate_weaver_icons.py and inlined into
# templates/weaver/_icons.jinja, so the published pages carry the artwork and
# fetch nothing.
#
# Carbon is not an arbitrary choice. The Netsuke sub-site already migrated off
# Font Awesome to Carbon and documents its reasoning and its mapping at
# templates/netsuke/pages/icon-replacements.jinja; twenty-five of the glyphs
# below are that table's, reused so the two sub-sites do not disagree about
# what a shield or a terminal looks like. Netsuke renders them through the
# Iconify CDN, which is why this file exists rather than the same approach:
# the point here is to stop calling out to anyone.
#
# `match` records how close the substitution is, and is the field to read when
# an icon looks wrong:
#
#   exact     the same metaphor, drawn in Carbon's style
#   near      the same idea, a different object - `fa-book-open` becomes a
#             closed book, `fa-server` a bare-metal server
#   creative  no Carbon equivalent exists and this is a deliberate
#             reinterpretation - `fa-rust` becomes a development mark,
#             `fa-stamp` a certificate
#
# Adding an icon: add a row here, run the generator, commit both. The test in
# tests/test_weaver_build.py fails if the committed file drifts from what the
# generator produces.

icons:
  # Inherited from the Netsuke mapping
  fa-arrow-right:
    carbon: carbon:arrow-right
    match: exact
  fa-bolt:
    carbon: carbon:flash
    match: exact
  fa-book:
    carbon: carbon:book
    match: exact
  fa-book-open:
    carbon: carbon:book
    match: near
  fa-check:
    carbon: carbon:checkmark
    match: exact
  fa-circle-info:
    carbon: carbon:information-filled
    match: exact
  fa-code:
